<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Basalt Community Runs</title>
<link rel="icon" href="mark.svg">
<style>
@font-face { font-family: "Geist"; font-weight: 100 900; font-display: swap; src: url(fonts/geist-latin-wght.woff2) format("woff2"); }
@font-face { font-family: "Geist Mono"; font-weight: 100 900; font-display: swap; src: url(fonts/geist-mono-latin-wght.woff2) format("woff2"); }
:root {
  --bg: #0E1114; --panel: #151A1F; --raised: #2A333C; --line: #28313A; --line-soft: #222A32;
  --fg: #E9ECEE; --fg-2: #9AA4AD; --fg-3: #77828C; --accent: #FF7A3D;
  --font-sans: "Geist", "Helvetica Neue", Arial, sans-serif;
  --font-mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 400 14px/1.5 var(--font-sans); }
main { max-width: 1180px; margin: 0 auto; padding: 0 16px 48px; }
header { display: flex; align-items: center; gap: 16px; padding: 40px 0 16px; }
header img { width: 80px; height: 80px; flex: none; }
header .names { display: flex; flex-direction: column; gap: 7px; }
.wordmark { font: 700 30px/1 var(--font-sans); letter-spacing: -.035em; }
.title { font: 500 15px/1 var(--font-sans); color: var(--fg-2); }

/* Page background: a faint honeycomb, strongest top right, with a hex cluster in that corner. */
.bg { position: fixed; inset: 0; z-index: -1; pointer-events: none; overflow: hidden; }
.bg .grid { position: absolute; inset: 0; width: 100%; height: 100%; color: #161C21;
  -webkit-mask-image: radial-gradient(ellipse 90% 80% at 100% 0%, #000 0%, rgba(0,0,0,.35) 55%, transparent 100%);
  mask-image: radial-gradient(ellipse 90% 80% at 100% 0%, #000 0%, rgba(0,0,0,.35) 55%, transparent 100%); }
.bg .cluster { position: absolute; top: -40px; right: -120px; width: 760px; height: 480px;
  -webkit-mask-image: linear-gradient(200deg, #000 30%, transparent 85%); mask-image: linear-gradient(200deg, #000 30%, transparent 85%); }
.bg .cluster .d { fill: #13181D; stroke: #1C232A; stroke-width: 1.5; }
.bg .cluster .m { fill: #171D23; stroke: #20282F; stroke-width: 1.5; }
.bg .cluster .f { fill: none; stroke: #1A2026; stroke-width: 1.5; }
.bg .cluster .e { fill: url(#ember); opacity: .5; }
.bg .ember { fill: #F2662B; opacity: .07; }
body { background: var(--bg); }
.wrap { background: var(--bg); }
p.lede { color: var(--fg-2); max-width: 72ch; margin: 8px 0 20px; }
p.lede code, .how code { font-family: var(--font-mono); color: var(--fg); background: var(--panel); padding: 1px 6px; border-radius: 4px; }
.controls { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
.controls input, .ms > button {
  background: var(--panel); border: 1px solid var(--line); border-radius: 6px; color: var(--fg);
  font: 400 13.5px/1 var(--font-mono); padding: 9px 12px; min-width: 0;
}
.controls input { flex: 1 1 220px; }
.controls input:focus, .ms > button:focus-visible { outline: none; border-color: var(--accent); }

/* Multi-select dropdown: a button and a checkbox list in a popover. */
.ms { position: relative; flex: 0 1 auto; }
.ms > button { display: flex; align-items: center; gap: 10px; cursor: pointer; white-space: nowrap; }
.ms > button::after { content: ""; width: 6px; height: 6px; border: solid var(--fg-3); border-width: 0 1.5px 1.5px 0; transform: translateY(-2px) rotate(45deg); transition: transform .15s; }
.ms[data-open] > button { border-color: var(--raised); }
.ms[data-open] > button::after { transform: translateY(1px) rotate(-135deg); }
.ms[data-active] > button { color: var(--accent); border-color: rgba(255, 122, 61, .45); }
.ms .pop {
  position: absolute; top: calc(100% + 6px); left: 0; z-index: 10; min-width: 100%; max-height: 300px; overflow-y: auto;
  background: var(--panel); border: 1px solid var(--raised); border-radius: 8px; padding: 6px;
  box-shadow: 0 12px 32px rgba(0, 0, 0, .45);
}
.ms:not([data-open]) .pop { display: none; }
.ms .opt {
  display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px 10px; border-radius: 5px;
  font: 400 13.5px/1 var(--font-mono); color: var(--fg-2); white-space: nowrap; cursor: pointer; text-align: left;
  background: none; border: 0;
}
.ms .opt:hover, .ms .opt:focus-visible { background: var(--raised); color: var(--fg); outline: none; }
.ms .box { width: 14px; height: 14px; flex: none; display: grid; place-items: center; border: 1.5px solid var(--fg-3); border-radius: 3px; }
.ms .box svg { width: 10px; height: 10px; visibility: hidden; }
.ms .opt[aria-checked="true"] { color: var(--fg); }
.ms .opt[aria-checked="true"] .box { background: var(--accent); border-color: var(--accent); }
.ms .opt[aria-checked="true"] .box svg { visibility: visible; }
.ms .n { margin-left: auto; padding-left: 16px; color: var(--fg-3); font-size: 12px; }
.ms .clear { display: block; width: 100%; margin-top: 4px; padding: 8px 10px; border-top: 1px solid var(--line); border-radius: 0; color: var(--fg-3); font: 400 12.5px/1 var(--font-sans); text-align: left; cursor: pointer; background: none; border-left: 0; border-right: 0; border-bottom: 0; }
.ms .clear:hover { color: var(--accent); }
.count { font: 400 13px/1 var(--font-mono); color: var(--fg-3); align-self: center; margin-left: auto; }
.wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; }
table { border-collapse: collapse; width: 100%; font: 400 13.5px/1.4 var(--font-mono); font-variant-numeric: tabular-nums; }
th, td { padding: 10px 12px; text-align: left; white-space: nowrap; border-bottom: 1px solid var(--line-soft); }
th { color: var(--fg-3); font-weight: 500; font-family: var(--font-sans); font-size: 13px; background: var(--panel); position: sticky; top: 0; cursor: pointer; user-select: none; }
th:hover { color: var(--fg); }
th[aria-sort="ascending"]::after { content: " ↑"; color: var(--accent); }
th[aria-sort="descending"]::after { content: " ↓"; color: var(--accent); }
th.num, td.num { text-align: right; }
tbody tr:hover { background: var(--panel); }
tbody tr:last-child td { border-bottom: 0; }
td.hi { color: var(--accent); }
td.dim { color: var(--fg-3); }
td a { color: var(--fg-2); }
tr.x { cursor: pointer; }
.chev { display: inline-flex; align-items: center; justify-content: center; width: 14px; height: 14px; margin-right: 6px; vertical-align: -2px; color: var(--fg-3); transition: transform .15s; }
.chev svg { width: 10px; height: 10px; }
tr.x[aria-expanded="true"] .chev { transform: rotate(90deg); color: var(--accent); }
.more { color: var(--fg-3); }
tr.detail td { background: var(--panel); padding: 4px 12px 12px 32px; }
tr.detail:hover { background: none; }
.cards { display: grid; grid-template-columns: auto auto auto auto; gap: 4px 28px; justify-content: start; color: var(--fg-2); }
.cards .h { color: var(--fg-3); font-family: var(--font-sans); font-size: 12px; }
.cards .r { text-align: right; }
.empty { padding: 32px; text-align: center; color: var(--fg-3); }
.how { margin-top: 28px; color: var(--fg-2); max-width: 72ch; }
.how h2 { font-size: 15px; color: var(--fg); margin: 0 0 6px; }
.how ol { margin: 0; padding-left: 20px; }
</style>
</head>
<body>
<div class="bg" aria-hidden="true"><svg class="grid"><defs><pattern id="hex" width="24.25" height="42" patternUnits="userSpaceOnUse"><g fill="none" stroke="currentColor" stroke-width="1"><polygon points="12.12,0 24.25,7 24.25,21 12.12,28 0,21 0,7"/><polygon points="0,21 12.12,28 12.12,42 0,49 -12.12,42 -12.12,28"/><polygon points="24.25,21 36.37,28 36.37,42 24.25,49 12.12,42 12.12,28"/></g></pattern></defs><rect width="100%" height="100%" fill="url(#hex)"/><polygon class="ember" points="739.6,43.0 750.9,49.5 750.9,62.5 739.6,69.0 728.4,62.5 728.4,49.5"/><polygon class="ember" points="642.6,127.0 653.9,133.5 653.9,146.5 642.6,153.0 631.4,146.5 631.4,133.5"/><polygon class="ember" points="873.0,190.0 884.3,196.5 884.3,209.5 873.0,216.0 861.7,209.5 861.7,196.5"/><polygon class="ember" points="533.5,64.0 544.8,70.5 544.8,83.5 533.5,90.0 522.2,83.5 522.2,70.5"/><polygon class="ember" points="836.6,295.0 847.9,301.5 847.9,314.5 836.6,321.0 825.4,314.5 825.4,301.5"/><polygon class="ember" points="460.8,232.0 472.0,238.5 472.0,251.5 460.8,258.0 449.5,251.5 449.5,238.5"/><polygon class="ember" points="982.1,85.0 993.4,91.5 993.4,104.5 982.1,111.0 970.9,104.5 970.9,91.5"/><polygon class="ember" points="1079.1,253.0 1090.4,259.5 1090.4,272.5 1079.1,279.0 1067.9,272.5 1067.9,259.5"/></svg><svg class="cluster" viewBox="0 0 760 480" aria-hidden="true"><defs><linearGradient id="ember" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFC566"/><stop offset=".55" stop-color="#F2662B"/><stop offset="1" stop-color="#C9461C"/></linearGradient></defs><polygon class="m" points="400.0,72.0 450.2,101.0 450.2,159.0 400.0,188.0 349.8,159.0 349.8,101.0"/><polygon class="d" points="507.4,72.0 557.6,101.0 557.6,159.0 507.4,188.0 457.2,159.0 457.2,101.0"/><polygon class="d" points="292.6,72.0 342.8,101.0 342.8,159.0 292.6,188.0 242.4,159.0 242.4,101.0"/><polygon class="d" points="453.7,165.0 503.9,194.0 503.9,252.0 453.7,281.0 403.5,252.0 403.5,194.0"/><polygon class="f" points="346.3,165.0 396.5,194.0 396.5,252.0 346.3,281.0 296.1,252.0 296.1,194.0"/><polygon class="m" points="561.1,165.0 611.3,194.0 611.3,252.0 561.1,281.0 510.9,252.0 510.9,194.0"/><polygon class="d" points="453.7,-21.0 503.9,8.0 503.9,66.0 453.7,95.0 403.5,66.0 403.5,8.0"/><polygon class="d" points="561.1,-21.0 611.3,8.0 611.3,66.0 561.1,95.0 510.9,66.0 510.9,8.0"/><polygon class="f" points="346.3,-21.0 396.5,8.0 396.5,66.0 346.3,95.0 296.1,66.0 296.1,8.0"/><polygon class="e" points="614.8,72.0 665.0,101.0 665.0,159.0 614.8,188.0 564.5,159.0 564.5,101.0"/><polygon class="d" points="668.5,165.0 718.7,194.0 718.7,252.0 668.5,281.0 618.2,252.0 618.2,194.0"/><polygon class="d" points="614.8,258.0 665.0,287.0 665.0,345.0 614.8,374.0 564.5,345.0 564.5,287.0"/><polygon class="f" points="507.4,258.0 557.6,287.0 557.6,345.0 507.4,374.0 457.2,345.0 457.2,287.0"/><polygon class="f" points="722.2,258.0 772.4,287.0 772.4,345.0 722.2,374.0 671.9,345.0 671.9,287.0"/><polygon class="d" points="722.2,72.0 772.4,101.0 772.4,159.0 722.2,188.0 671.9,159.0 671.9,101.0"/><polygon class="f" points="238.9,165.0 289.1,194.0 289.1,252.0 238.9,281.0 188.7,252.0 188.7,194.0"/><polygon class="f" points="185.2,72.0 235.5,101.0 235.5,159.0 185.2,188.0 135.0,159.0 135.0,101.0"/><polygon class="f" points="400.0,258.0 450.2,287.0 450.2,345.0 400.0,374.0 349.8,345.0 349.8,287.0"/></svg></div>
<main>
  <header>
    <img src="mark.svg" alt="">
    <div class="names">
      <span class="wordmark">Basalt</span>
      <span class="title">Community runs</span>
    </div>
  </header>
  <p class="lede">Performance submitted by users, all from the same preset (<code id="preset">basalt-bench --community</code>).</p>

  <div class="controls">
    <input id="q" type="search" placeholder="Search GPU, quant, submitter…" aria-label="Search">
    <div class="ms" id="f-gpu"></div>
    <div class="ms" id="f-n"></div>
    <div class="ms" id="f-quant"></div>
    <div class="ms" id="f-os"></div>
    <span class="count" id="count"></span>
  </div>

  <div class="wrap">
    <table>
      <thead><tr id="head"></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>

  <section class="how">
    <h2>Add your run</h2>
    <ol>
      <li>Stop any running Basalt server, run <code>basalt-bench --community</code> and copy the JSON row it prints.</li>
      <li>Open a pull request that adds the row to <code>docs/community/benchmarks.json</code>.</li>
    </ol>
  </section>
</main>
<script>
const COLS = [
  { key: "_rig", label: "GPUs", html: r => (r._n > 1 ? `<span class="chev"><svg viewBox="0 0 10 10" aria-hidden="true"><path d="M3.5 1.5 7 5 3.5 8.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span>` : `<span class="chev"></span>`) + r._short },
  { key: "_vram", label: "VRAM", num: true, fmt: v => v + " GiB" },
  { key: "_power", label: "Power", num: true, fmt: v => v.toLocaleString("en-US") + " W" },
  { key: "ram_gib", label: "RAM", num: true, fmt: v => v + " GiB" },
  { key: "os", label: "System" },
  { key: "quant", label: "Quant" },
  { key: "prefill_16k_tps", label: "Prefill 16K", num: true, hi: true, fmt: v => v.toLocaleString("en-US") },
  { key: "prefill_64k_tps", label: "Prefill 64K", num: true, hi: true, fmt: v => v.toLocaleString("en-US") },
  { key: "decode_tps", label: "Decode tok/s", num: true, hi: true, fmt: v => v.toLocaleString("en-US", { maximumFractionDigits: 1 }) },
  { key: "commit", label: "Commit" },
  { key: "date", label: "Date" },
  { key: "submitter", label: "By", link: true },
];

let runs = [];
let sort = { key: "decode_tps", dir: -1 };
const open = new Set();
const $ = id => document.getElementById(id);

function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }

// Multi-select: picks within one filter are OR'd, filters are AND'd. Each option shows how many runs have it.
const filters = {};
function multiSelect(id, all, options) {
  const root = $(id), picked = new Set();
  filters[id] = picked;
  root.innerHTML = `<button type="button" aria-haspopup="true" aria-expanded="false"></button>` +
    `<div class="pop" role="menu">` +
    options.map(o => `<button type="button" class="opt" role="menuitemcheckbox" aria-checked="false" data-v="${esc(o.value)}">` +
      `<span class="box"><svg viewBox="0 0 10 10" aria-hidden="true"><path d="M1.5 5.2 4 7.6 8.5 2.6" fill="none" stroke="#0E1114" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span>${esc(o.label)}<span class="n">${o.count}</span></button>`).join("") +
    `<button type="button" class="clear">Clear</button></div>`;
  const btn = root.firstElementChild;
  const label = () => {
    const sel = options.filter(o => picked.has(o.value));
    btn.textContent = !sel.length ? all : sel.length === 1 ? sel[0].label : `${sel.length} selected · ${all.replace(/^All |^Any /, "")}`;
    sel.length ? root.setAttribute("data-active", "") : root.removeAttribute("data-active");
  };
  const setOpen = on => {
    document.querySelectorAll(".ms[data-open]").forEach(m => { if (m !== root) { m.removeAttribute("data-open"); m.firstElementChild.setAttribute("aria-expanded", "false"); } });
    on ? root.setAttribute("data-open", "") : root.removeAttribute("data-open");
    btn.setAttribute("aria-expanded", String(on));
  };
  btn.addEventListener("click", () => {
    const on = !root.hasAttribute("data-open");
    setOpen(on);
    if (on) root.querySelector(".opt")?.focus();
  });
  root.querySelector(".pop").addEventListener("click", e => {
    const opt = e.target.closest(".opt");
    if (opt) {
      const v = opt.dataset.v;
      picked.has(v) ? picked.delete(v) : picked.add(v);
      opt.setAttribute("aria-checked", String(picked.has(v)));
    } else if (e.target.closest(".clear")) {
      picked.clear();
      root.querySelectorAll(".opt").forEach(o => o.setAttribute("aria-checked", "false"));
    } else return;
    label(); render();
  });
  root.addEventListener("keydown", e => {
    const opts = [...root.querySelectorAll(".opt, .clear")], k = opts.indexOf(document.activeElement);
    if (e.key === "Escape") { setOpen(false); btn.focus(); }
    else if (e.key === "ArrowDown" || e.key === "ArrowUp") {
      e.preventDefault();
      if (!root.hasAttribute("data-open")) { setOpen(true); opts[0]?.focus(); return; }
      opts[(k + (e.key === "ArrowDown" ? 1 : -1) + opts.length) % opts.length]?.focus();
    }
  });
  label();
}
document.addEventListener("click", e => {
  if (!e.target.closest(".ms")) document.querySelectorAll(".ms[data-open]").forEach(m => { m.removeAttribute("data-open"); m.firstElementChild.setAttribute("aria-expanded", "false"); });
});

function countBy(values) {
  const m = new Map();
  values.forEach(v => m.set(v, (m.get(v) || 0) + 1));
  return [...m].sort((a, b) => String(a[0]).localeCompare(String(b[0]))).map(([value, count]) => ({ value, label: value, count }));
}
const any = (id, test) => !filters[id]?.size || [...filters[id]].some(test);

// Full rig label for search; the cell shows a short one ("2× RTX 5080", "RTX 5090 +3") and the
// expanded row lists every card. Totals drive sorting.
function rig(r, i) {
  const g = r.gpus || [];
  const counts = new Map();
  g.forEach(x => counts.set(x.name, (counts.get(x.name) || 0) + 1));
  const parts = [...counts].map(([n, k]) => (k > 1 ? k + "× " : "") + n);
  r._id = i;
  r._rig = parts.join(" + ");
  r._short = parts.length > 1 ? esc(g[0].name) + ` <span class="more">+${g.length - 1}</span>` : esc(r._rig);
  r._names = g.map(x => x.name);
  r._n = g.length;
  r._vram = g.reduce((s, x) => s + (x.vram_gib || 0), 0);
  r._power = g.reduce((s, x) => s + (x.power_w || 0), 0);
  return r;
}

function detail(r) {
  const cells = r.gpus.map((x, k) =>
    `<span>GPU ${k}</span><span>${esc(x.name)}</span><span class="r">${x.vram_gib} GiB</span><span class="r">${x.power_w} W</span>`).join("");
  return `<tr class="detail"><td colspan="${COLS.length}"><div class="cards">` +
    `<span class="h">#</span><span class="h">Card</span><span class="h r">VRAM</span><span class="h r">Power limit</span>` +
    cells + `</div></td></tr>`;
}

function renderHead() {
  $("head").innerHTML = COLS.map(c => {
    const s = sort.key === c.key ? (sort.dir > 0 ? "ascending" : "descending") : "none";
    return `<th data-key="${c.key}" class="${c.num ? "num" : ""}" aria-sort="${s}" scope="col">${c.label}</th>`;
  }).join("");
}

function render() {
  const q = $("q").value.trim().toLowerCase();
  const shown = runs.filter(r =>
    any("f-gpu", v => r._names.includes(v)) && any("f-n", v => v === String(Math.min(r._n, 3))) &&
    any("f-quant", v => r.quant === v) && any("f-os", v => r.os === v) &&
    (!q || COLS.some(c => String(r[c.key] ?? "").toLowerCase().includes(q)) || String(r.preset ?? "").toLowerCase().includes(q)));
  shown.sort((a, b) => {
    const x = a[sort.key], y = b[sort.key];
    return (typeof x === "number" ? x - y : String(x).localeCompare(String(y))) * sort.dir;
  });
  $("rows").innerHTML = shown.length ? shown.map(r => {
    const multi = r._n > 1, isOpen = multi && open.has(r._id);
    const tr = multi ? `<tr class="x" data-id="${r._id}" aria-expanded="${isOpen}" tabindex="0">` : "<tr>";
    return tr + COLS.map(c => {
      const v = r[c.key] ?? "";
      let text = c.html ? c.html(r) : esc(c.fmt ? c.fmt(v) : v);
      if (c.link && r.link) text = `<a href="${esc(r.link)}" rel="noopener">${text}</a>`;
      const cls = [c.num && "num", c.hi && "hi"].filter(Boolean).join(" ");
      return `<td class="${cls}">${text}</td>`;
    }).join("") + "</tr>" + (isOpen ? detail(r) : "");
  }).join("")
    : `<tr><td class="empty" colspan="${COLS.length}">${runs.length ? "No runs match." : "No runs yet. Be the first: see below."}</td></tr>`;
  $("count").textContent = `${shown.length} of ${runs.length} runs`;
}

$("head").addEventListener("click", e => {
  const th = e.target.closest("th"); if (!th) return;
  const key = th.dataset.key, col = COLS.find(c => c.key === key);
  sort = sort.key === key ? { key, dir: -sort.dir } : { key, dir: col.num ? -1 : 1 };
  renderHead(); render();
});
function toggle(e) {
  const tr = e.target.closest("tr.x");
  if (!tr || e.target.closest("a")) return;
  if (e.type === "keydown" && e.key !== "Enter" && e.key !== " ") return;
  e.preventDefault();
  const id = +tr.dataset.id;
  open.has(id) ? open.delete(id) : open.add(id);
  render();
}
$("rows").addEventListener("click", toggle);
$("rows").addEventListener("keydown", toggle);
$("q").addEventListener("input", render);

fetch("benchmarks.json").then(r => r.json()).then(data => {
  runs = (data.runs || []).map((r, i) => rig(r, i));
  if (data.preset) $("preset").textContent = data.preset;
  multiSelect("f-gpu", "All GPUs", countBy(runs.flatMap(r => [...new Set(r._names)])));
  multiSelect("f-n", "Any GPU count", countBy(runs.map(r => String(Math.min(r._n, 3))))
    .map(o => ({ ...o, label: o.value === "1" ? "1 GPU" : o.value === "3" ? "3+ GPUs" : o.value + " GPUs" })));
  multiSelect("f-quant", "All quants", countBy(runs.map(r => r.quant)));
  multiSelect("f-os", "All systems", countBy(runs.map(r => r.os)));
  renderHead(); render();
}).catch(() => { $("rows").innerHTML = `<tr><td class="empty" colspan="12">Could not load benchmarks.json.</td></tr>`; });
</script>
</body>
</html>
