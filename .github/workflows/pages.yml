name: pages

# Validates the community benchmark file on pull requests and publishes the community runs page from main.
on:
  pull_request:
    paths:
      - "docs/community/**"
      - "site/**"
      - "tools/check_benchmarks.py"
      - ".github/workflows/pages.yml"
  push:
    branches: [main]
    paths:
      - "docs/community/**"
      - "site/**"
      - "tools/check_benchmarks.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Validate benchmarks.json
        run: python3 tools/check_benchmarks.py docs/community/benchmarks.json

  deploy:
    if: github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Assemble site
        run: |
          mkdir -p _site/fonts
          cp site/index.html docs/community/benchmarks.json serve/web/mark.svg _site/
          cp serve/web/fonts/*.woff2 serve/web/fonts/OFL.txt _site/fonts/
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
